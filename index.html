<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="container">
        <div id="part-1">
            <h1>Metric/Imperial Unit Conversion</h1><input type="text" id="input">
            <button id="convert-btn">Convert</button>
        </div>
        <div id="part-2">
            <div id="length" class="convert">
                <h2>Length (Meter/Feet)</h2>
                <p id="p-length"></p>
            </div>
            <div id="volume" class="convert">
                <h2>Volume (Liters/Gallons)</h2>
                <p id="p-volume"></p>
            </div>
            <div id="mass" class="convert">
                <h2>Mass (Kilograms/Pounds)</h2>
                <p id="p-mass"></p>
            </div>
        </div>

    </div>
    <script src="index.js"></script>
</body>

</html>
